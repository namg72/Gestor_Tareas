services:
  mysql:
    image: mysql:8.4
    container_name: tablero-tareas-db
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - .env
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  datos_mysql:
